commonConfiguration: |-
  # Enable ReJSON, Redisearch, redistimeseries
  loadmodule /opt/iamguarded/redis/lib/redis/modules/redisearch.so
  loadmodule /opt/iamguarded/redis/lib/redis/modules/rejson.so
  loadmodule /opt/iamguarded/redis/lib/redis/modules/redistimeseries.so DUPLICATE_POLICY LAST
  # Enable AOF https://redis.io/topics/persistence#append-only-file
  appendonly yes
  # Disable RDB persistence, AOF persistence already enabled.
  save ""

auth:
  password: ${REDIS_PASSWORD}

serviceBindings:
  enabled: true

master:
  podSecurityContext:
    enabled: true
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ["ALL"]
  persistence:
    enabled: true
    size: "${PERSISTENCE_MASTER_SIZE}"
    storageClass: "${PERSISTENCE_MASTER_STORAGE_CLASS}"
    existingClaim: "${PERSISTENCE_MASTER_PVC}"
  podLabels:
    networking/traffic-allowed: "yes"
  tolerations:
  - key: "vendor"
    operator: "Equal"
    value: "cosmotech"
    effect: "NoSchedule"
  nodeSelector:
    "cosmotech.com/tier": "db"
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

replica:
  podSecurityContext:
    enabled: true
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ["ALL"]
  replicaCount: 1
  podLabels:
    networking/traffic-allowed: "yes"
  persistence:
    enabled: true
    size: "${PERSISTENCE_REPLICA_SIZE}"
    storageClass: "${PERSISTENCE_REPLICA_STORAGE_CLASS}"
    existingClaim: "${PERSISTENCE_REPLICA_PVC}"
  tolerations:
  - key: "vendor"
    operator: "Equal"
    value: "cosmotech"
    effect: "NoSchedule"
  nodeSelector:
    "cosmotech.com/tier": "db"
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

image:
  # imageRegistry: ${IMAGE_REGISTRY}
  repository: ${REDIS_IMAGE_REPOSITORY}
  tag: "${REDIS_IMAGE_TAG}"
  pullPolicy: IfNotPresent

sysctl:
  image:
    repository: cosmotech/os-shell-iamguarded
    tag: latest
    pullPolicy: IfNotPresent

volumePermissions:
  enabled: false

global:
  # imageRegistry: ${IMAGE_REGISTRY}
  imagePullSecrets:
    - name: ${IMAGE_REGISTRY_AUTH_SECRET}