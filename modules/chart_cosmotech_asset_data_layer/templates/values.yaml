name: ${NAMESPACE}-asset-data-layer

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  pathType: ImplementationSpecific
  hosts:
    - host: "${CLUSTER_DOMAIN}"
      paths:
        - path: /
          pathType: ImplementationSpecific
  annotations:
    kubernetes.io/ingress.class: traefik
  tls:
    enabled: true
    secretName: "letsencrypt-prod-${NAMESPACE}"
    hosts:
      - "${CLUSTER_DOMAIN}"

apiConfig:
  rootUri: "/${NAMESPACE}/api/asset"
  dataDir: "/data"
  corsOrigin:
    - https://${CLUSTER_DOMAIN}/adl/main

image:
  repository: ${REGISTRY}/${COSMOTECH_ASSET_DATA_LAYER_IMAGE_NAME}
  tag: ${COSMOTECH_ASSET_DATA_LAYER_IMAGE_TAG}
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ${REGISTRY_AUTH_SECRET}

replicaCount: 1

autoscaling:
  enabled: false

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

tolerations:
  - effect: NoSchedule
    key: vendor
    operator: Equal
    value: cosmotech

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  cosmotech.com/tier: services

extraEnvVars:
  - name: CSM_API_URL
    value: cosmotech-api-${NAMESPACE}.${NAMESPACE}.svc.cluster.local:8080

persistence:
  enabled: true
  size: "${PERSISTENCE_SIZE}"
  storageClass: "${PERSISTENCE_STORAGE_CLASS}"
  existingClaim: "${PERSISTENCE_PVC}"

database:
  reset: false

postgres:
  enabled: true
  host: "${DB_HOST}"
  port: "${DB_PORT}"
  database: "${DB_NAME}"
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  schema: "cosmotech_asset_data_layer"

keycloak:
  realm: "https://${CLUSTER_DOMAIN}/keycloak/realms/${NAMESPACE}"
  clientId: "${KEYCLOAK_CLIENT_ID}"

seaweedfs:
  enabled: false

csmApi:
  url: "http://cosmotech-api-${NAMESPACE}.${NAMESPACE}.svc.cluster.local:8080"
  scope: ""
  clientId: "${COSMOTECH_API_CLIENT_ID}"
  clientSecret: "${COSMOTECH_API_CLIENT_SECRET}"

usage:
  enabled: true

localStorage:
  path: "/data/local_storage"

alembic:
  script_location: "cosmotech/asset_data_layer/migrations"

webhookRestart:
  enabled: false
