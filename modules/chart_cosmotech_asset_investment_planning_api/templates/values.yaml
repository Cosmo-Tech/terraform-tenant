image:
  repository: ${REGISTRY}/${COSMOTECH_ASSET_INVESTMENT_PLANNING_API_IMAGE_NAME}
  tag: ${COSMOTECH_ASSET_INVESTMENT_PLANNING_API_IMAGE_TAG}
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ${REGISTRY_AUTH_SECRET}

replicaCount: 1

autoscalling:
  enabled: false

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

tolerations:
  - effect: NoSchedule
    key: vendor
    operator: Equal
    value: cosmotech

resources:
  limits:
    cpu: 200m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

nodeSelector:
  cosmotech.com/tier: services

extraEnvVars:
  - name: CSM_API_URL
    value: cosmotech-api-${NAMESPACE}.${NAMESPACE}.svc.cluster.local:8080

persistence:
  enabled: false

database:
  reset: false

postgres:
  enabled: true
  host: "${DB_HOST}"
  port: "${DB_PORT}"
  database: "${DB_NAME}"
  username: "${DB_ADMIN_USERNAME}"
  password: "${DB_ADMIN_PASSWORD}"
  schema: "${DB_SCHEMA_NAME}"

apiConfig:
  corsOrigin:
    - https://${CLUSTER_DOMAIN}/${NAMESPACE}/api
  dataDir: /data
  keycloakRealm: https://${CLUSTER_DOMAIN}/keycloak/realms/${NAMESPACE}
  rootUri: /${NAMESPACE}/api

alembic:
  script_location: cosmotech/aip/migrations

webhookRestart:
  enabled: false
