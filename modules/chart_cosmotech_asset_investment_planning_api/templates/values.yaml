name: ${NAMESPACE}-api

serviceAccount:
  create: true

service:
  port: 8080
  type: ClusterIP

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: "${CLUSTER_DOMAIN}"
      paths:
        - path: /${NAMESPACE}/api
          pathType: ImplementationSpecific
  annotations:
    kubernetes.io/ingress.class: traefik
  tls:
    enabled: true
    secretName: "letsencrypt-prod-${NAMESPACE}"
    hosts:
      - "${CLUSTER_DOMAIN}"

